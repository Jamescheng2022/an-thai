<svg xmlns="http://www.w3.org/2000/svg" width="720" height="990" viewBox="0 0 720 990" role="img" aria-label="Five-file pile test previsit document handover, including pile register, as-built dimensions, installation history, soil information, and decision brief."><title>Five-file pile test previsit document handover, including pile register, as-built dimensions, installation history, soil information, and decision brief.</title><rect x="0" y="0" width="720" height="990" rx="0" fill="#f6f8f8" stroke="none" stroke-width="0"/><rect x="35" y="36" width="650" height="918" rx="24" fill="#ffffff" stroke="#d4dfe2" stroke-width="2"/><text x="66" y="101" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="700" fill="#102f49" >THE FIVE-FILE HANDOVER</text><text x="66" y="147" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="500" fill="#146c78" >Send before the visit — not after the report.</text><rect x="66" y="184" width="585" height="118" rx="16" fill="#eef3f5" stroke="none" stroke-width="0"/><rect x="85" y="204" width="76" height="76" rx="14" fill="#102f49" stroke="none" stroke-width="0"/><text x="104" y="253" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="700" fill="#f3d3a2" >01</text><text x="184" y="229" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#203d51" >PILE REGISTER</text><text x="184" y="265" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="500" fill="#536c77" >IDs, locations and selected pile list</text><rect x="66" y="324" width="585" height="118" rx="16" fill="#f4f8f7" stroke="none" stroke-width="0"/><rect x="85" y="344" width="76" height="76" rx="14" fill="#102f49" stroke="none" stroke-width="0"/><text x="104" y="393" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="700" fill="#f3d3a2" >02</text><text x="184" y="369" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#203d51" >AS-BUILT DETAILS</text><text x="184" y="405" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="500" fill="#536c77" >Type, section and nominal length</text><rect x="66" y="464" width="585" height="118" rx="16" fill="#eef3f5" stroke="none" stroke-width="0"/><rect x="85" y="484" width="76" height="76" rx="14" fill="#102f49" stroke="none" stroke-width="0"/><text x="104" y="533" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="700" fill="#f3d3a2" >03</text><text x="184" y="509" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#203d51" >INSTALLATION HISTORY</text><text x="184" y="545" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="500" fill="#536c77" >Dates, concrete or driving notes, anomalies</text><rect x="66" y="604" width="585" height="118" rx="16" fill="#f4f8f7" stroke="none" stroke-width="0"/><rect x="85" y="624" width="76" height="76" rx="14" fill="#102f49" stroke="none" stroke-width="0"/><text x="104" y="673" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="700" fill="#f3d3a2" >04</text><text x="184" y="649" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#203d51" >GROUND CONTEXT</text><text x="184" y="685" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="500" fill="#536c77" >Available boreholes and soil profile</text><rect x="66" y="744" width="585" height="118" rx="16" fill="#eef3f5" stroke="none" stroke-width="0"/><rect x="85" y="764" width="76" height="76" rx="14" fill="#102f49" stroke="none" stroke-width="0"/><text x="104" y="813" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="700" fill="#f3d3a2" >05</text><text x="184" y="789" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#203d51" >DECISION BRIEF</text><text x="184" y="825" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="500" fill="#536c77" >Objective, specification, reporting reviewer</text><text x="66" y="929" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#146c78" >No records? Mark gaps honestly; do not invent values.</text></svg>
