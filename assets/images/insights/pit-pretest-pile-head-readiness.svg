<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-label="Conceptual pile-head readiness chart showing safe access, prepared concrete surface, and technician-selected impact and sensor locations; not a dimensioned engineering drawing."><title>Conceptual pile-head readiness chart showing safe access, prepared concrete surface, and technician-selected impact and sensor locations; not a dimensioned engineering drawing.</title><rect x="0" y="0" width="720" height="980" rx="0" fill="#f6f8f8" stroke="none" stroke-width="0"/><rect x="35" y="32" width="650" height="915" rx="24" fill="#ffffff" stroke="#d4dfe2" stroke-width="2"/><text x="66" y="104" font-family="Arial,Helvetica,sans-serif" font-size="37" font-weight="700" fill="#102f49" >PILE-HEAD READINESS</text><text x="66" y="151" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="500" fill="#146c78" >A safe, accessible test surface matters.</text><rect x="66" y="200" width="589" height="110" rx="15" fill="#f4f7f8" stroke="none" stroke-width="0"/><rect x="82" y="218" width="64" height="72" rx="13" fill="#146c78" stroke="none" stroke-width="0"/><text x="101" y="266" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#ffffff" >A</text><text x="165" y="248" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#203d51" >CLEAR THE WORK ZONE</text><text x="165" y="282" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#56717e" >Safe access and an agreed work window</text><rect x="66" y="333" width="589" height="110" rx="15" fill="#eef5f4" stroke="none" stroke-width="0"/><rect x="82" y="351" width="64" height="72" rx="13" fill="#146c78" stroke="none" stroke-width="0"/><text x="101" y="399" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#ffffff" >B</text><text x="165" y="381" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#203d51" >PREPARE THE PILE HEAD</text><text x="165" y="415" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#56717e" >Expose suitable, sound test surface</text><rect x="66" y="466" width="589" height="110" rx="15" fill="#f4f7f8" stroke="none" stroke-width="0"/><rect x="82" y="484" width="64" height="72" rx="13" fill="#146c78" stroke="none" stroke-width="0"/><text x="101" y="532" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#ffffff" >C</text><text x="165" y="514" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#203d51" >CONFIRM TEST LOCATIONS</text><text x="165" y="548" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#56717e" >Technician selects impact / sensor points</text><rect x="190" y="639" width="340" height="191" rx="12" fill="#a9b9bc" stroke="none" stroke-width="0"/><rect x="178" y="621" width="365" height="33" rx="5" fill="#6b838d" stroke="none" stroke-width="0"/><path d="M359 631 L359 574" stroke="#c3a16f" stroke-width="11" stroke-linecap="round"/><path d="M344 578 L374 578" stroke="#c3a16f" stroke-width="9"/><rect x="447" y="586" width="36" height="35" rx="8" fill="#146c78"/><path d="M465 586 L497 559" stroke="#146c78" stroke-width="5" fill="none"/><text x="66" y="868" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#146c78" >Illustrative only — not a sensor layout</text><text x="66" y="908" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#4f6875" >Final method and safe working plan: testing engineer.</text></svg>
