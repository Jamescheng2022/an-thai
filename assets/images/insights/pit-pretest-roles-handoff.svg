<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1030" viewBox="0 0 720 1030" role="img" aria-label="Pre-test handover responsibilities diagram for owner, contractor, testing team, and design engineer, emphasizing agreed scope and review."><title>Pre-test handover responsibilities diagram for owner, contractor, testing team, and design engineer, emphasizing agreed scope and review.</title><rect x="0" y="0" width="720" height="1030" rx="0" fill="#f6f8f8" stroke="none" stroke-width="0"/><rect x="35" y="32" width="650" height="966" rx="24" fill="#ffffff" stroke="#d4dfe2" stroke-width="2"/><text x="66" y="100" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="700" fill="#102f49" >ONE SITE VISIT, FOUR ROLES</text><text x="66" y="150" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="500" fill="#146c78" >Clarify the handoffs before mobilization.</text><rect x="66" y="186" width="589" height="165" rx="17" fill="#f4f7f8" stroke="none" stroke-width="0"/><rect x="66" y="186" width="9" height="165" rx="4" fill="#c3a16f" stroke="none" stroke-width="0"/><text x="95" y="229" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#102f49" >OWNER / QA</text><text x="95" y="269" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#146c78" >Question to answer</text><text x="95" y="310" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500" fill="#56717e" >Define selection and intended decision</text><path d="M360 351 V373" stroke="#c3a16f" stroke-width="4" fill="none"/><path d="M350 363 L360 375 L370 363" stroke="#c3a16f" stroke-width="4" fill="none"/><rect x="66" y="382" width="589" height="165" rx="17" fill="#eef5f4" stroke="none" stroke-width="0"/><rect x="66" y="382" width="9" height="165" rx="4" fill="#146c78" stroke="none" stroke-width="0"/><text x="95" y="425" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#102f49" >CONTRACTOR</text><text x="95" y="465" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#146c78" >Physical readiness</text><text x="95" y="506" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500" fill="#56717e" >Provide access, IDs, site escort and records</text><path d="M360 547 V569" stroke="#c3a16f" stroke-width="4" fill="none"/><path d="M350 559 L360 571 L370 559" stroke="#c3a16f" stroke-width="4" fill="none"/><rect x="66" y="578" width="589" height="165" rx="17" fill="#f4f7f8" stroke="none" stroke-width="0"/><rect x="66" y="578" width="9" height="165" rx="4" fill="#c3a16f" stroke="none" stroke-width="0"/><text x="95" y="621" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#102f49" >TESTING TEAM</text><text x="95" y="661" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#146c78" >Method &amp; data</text><text x="95" y="702" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500" fill="#56717e" >Check feasibility, capture and document</text><path d="M360 743 V765" stroke="#c3a16f" stroke-width="4" fill="none"/><path d="M350 755 L360 767 L370 755" stroke="#c3a16f" stroke-width="4" fill="none"/><rect x="66" y="774" width="589" height="165" rx="17" fill="#eef5f4" stroke="none" stroke-width="0"/><rect x="66" y="774" width="9" height="165" rx="4" fill="#146c78" stroke="none" stroke-width="0"/><text x="95" y="817" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#102f49" >DESIGN ENGINEER</text><text x="95" y="857" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#146c78" >Interpretation</text><text x="95" y="898" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500" fill="#56717e" >Review anomalies and acceptance basis</text><text x="66" y="945" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#146c78" >Unclear objective or unsafe access?</text><text x="66" y="974" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#203d51" >Resolve the hold before booking the crew.</text></svg>
