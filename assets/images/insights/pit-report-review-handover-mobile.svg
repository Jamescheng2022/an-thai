<svg xmlns="http://www.w3.org/2000/svg" width="400" height="849" viewBox="0 0 400 849" role="img" aria-label="Review package"><rect width="400" height="849" fill="#f2f8f9"/><rect width="400" height="155" fill="#123e5a"/><text x="25" y="32" font-size="14" font-weight="700" fill="#cce6e9" font-family="Arial,Helvetica,sans-serif">AN-THAI  /  ENGINEERING INSIGHTS</text><text x="25" y="82" font-size="27" font-weight="700" fill="#ffffff" font-family="Arial,Helvetica,sans-serif">Review package</text><text x="25" y="121" font-size="17" font-weight="400" fill="#e0eff0" font-family="Arial,Helvetica,sans-serif">Ask for evidence, not a label.</text><rect x="18" y="177" width="364" height="87" rx="12" fill="#ffffff" stroke="#cee1e4"/><text x="36" y="210" font-size="21" font-weight="700" fill="#153c56" font-family="Arial,Helvetica,sans-serif">Pile identifiers</text><text x="36" y="239" font-size="18" font-weight="400" fill="#3e5b67" font-family="Arial,Helvetica,sans-serif">Schedule and position</text><rect x="18" y="278" width="364" height="87" rx="12" fill="#ffffff" stroke="#cee1e4"/><text x="36" y="311" font-size="21" font-weight="700" fill="#153c56" font-family="Arial,Helvetica,sans-serif">Design references</text><text x="36" y="340" font-size="18" font-weight="400" fill="#3e5b67" font-family="Arial,Helvetica,sans-serif">Drawings and pile type</text><rect x="18" y="379" width="364" height="87" rx="12" fill="#ffffff" stroke="#cee1e4"/><text x="36" y="412" font-size="21" font-weight="700" fill="#153c56" font-family="Arial,Helvetica,sans-serif">Ground information</text><text x="36" y="441" font-size="18" font-weight="400" fill="#3e5b67" font-family="Arial,Helvetica,sans-serif">Relevant ground profile</text><rect x="18" y="480" width="364" height="87" rx="12" fill="#ffffff" stroke="#cee1e4"/><text x="36" y="513" font-size="21" font-weight="700" fill="#153c56" font-family="Arial,Helvetica,sans-serif">Construction history</text><text x="36" y="542" font-size="18" font-weight="400" fill="#3e5b67" font-family="Arial,Helvetica,sans-serif">Field and installation records</text><rect x="18" y="581" width="364" height="112" rx="12" fill="#ffffff" stroke="#cee1e4"/><text x="36" y="614" font-size="21" font-weight="700" fill="#153c56" font-family="Arial,Helvetica,sans-serif">Original signal data</text><text x="36" y="643" font-size="18" font-weight="400" fill="#3e5b67" font-family="Arial,Helvetica,sans-serif">Report and appropriate raw</text><text x="36" y="668" font-size="18" font-weight="400" fill="#3e5b67" font-family="Arial,Helvetica,sans-serif">traces</text><rect x="18" y="707" width="364" height="87" rx="12" fill="#ffffff" stroke="#cee1e4"/><text x="36" y="740" font-size="21" font-weight="700" fill="#153c56" font-family="Arial,Helvetica,sans-serif">Decision basis</text><text x="36" y="769" font-size="18" font-weight="400" fill="#3e5b67" font-family="Arial,Helvetica,sans-serif">Method, reviewer and limitations</text><text x="24" y="827" font-size="15" font-weight="600" fill="#416373" font-family="Arial,Helvetica,sans-serif">Project rights and requirements vary.</text></svg>
