<svg xmlns="http://www.w3.org/2000/svg" width="400" height="596" viewBox="0 0 400 596" role="img" aria-label="What PIT can tell you"><rect width="400" height="596" fill="#f2f8f9"/><rect width="400" height="155" fill="#123e5a"/><text x="25" y="32" font-size="14" font-weight="700" fill="#cce6e9" font-family="Arial,Helvetica,sans-serif">AN-THAI  /  ENGINEERING INSIGHTS</text><text x="25" y="82" font-size="27" font-weight="700" fill="#ffffff" font-family="Arial,Helvetica,sans-serif">What PIT can tell you</text><text x="25" y="121" font-size="17" font-weight="400" fill="#e0eff0" font-family="Arial,Helvetica,sans-serif">A screen is not a load test.</text><rect x="18" y="177" width="364" height="112" rx="12" fill="#ffffff" stroke="#cee1e4"/><text x="36" y="210" font-size="21" font-weight="700" fill="#153c56" font-family="Arial,Helvetica,sans-serif">Useful for screening</text><text x="36" y="239" font-size="18" font-weight="400" fill="#3e5b67" font-family="Arial,Helvetica,sans-serif">Possible continuity changes</text><text x="36" y="264" font-size="18" font-weight="400" fill="#3e5b67" font-family="Arial,Helvetica,sans-serif">Site-dependent signal features</text><rect x="18" y="303" width="364" height="112" rx="12" fill="#ffffff" stroke="#cee1e4"/><text x="36" y="336" font-size="21" font-weight="700" fill="#153c56" font-family="Arial,Helvetica,sans-serif">Does not establish</text><text x="36" y="365" font-size="18" font-weight="400" fill="#3e5b67" font-family="Arial,Helvetica,sans-serif">Geotechnical capacity</text><text x="36" y="390" font-size="18" font-weight="400" fill="#3e5b67" font-family="Arial,Helvetica,sans-serif">Allowable project load</text><rect x="18" y="429" width="364" height="112" rx="12" fill="#ffffff" stroke="#cee1e4"/><text x="36" y="462" font-size="21" font-weight="700" fill="#153c56" font-family="Arial,Helvetica,sans-serif">Review conditions</text><text x="36" y="491" font-size="18" font-weight="400" fill="#3e5b67" font-family="Arial,Helvetica,sans-serif">Pile geometry and site records</text><text x="36" y="516" font-size="18" font-weight="400" fill="#3e5b67" font-family="Arial,Helvetica,sans-serif">Engineering acceptance basis</text><text x="24" y="574" font-size="15" font-weight="600" fill="#416373" font-family="Arial,Helvetica,sans-serif">Conceptual only; not a recorded trace.</text></svg>
