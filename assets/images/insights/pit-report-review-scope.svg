<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 930" width="720" height="930" role="img"><rect width="720" height="930" fill="#f4f8fa"/><rect x="35" y="32" width="650" height="120" rx="20" fill="#11314d" stroke="none" stroke-width="1"/><text x="60" y="79" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#a0dddf" >01  /  INTERPRETATION BOUNDARY</text><text x="60" y="126" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="700" fill="#ffffff" >What the test can tell</text><text x="40" y="196" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#4b6071" >Low-strain impact response is a screening input.</text>
<rect x="38" y="235" width="644" height="265" rx="24" fill="#e2f1ee" stroke="none" stroke-width="1"/>
<text x="65" y="283" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#116c6b" >CAN INFORM A REVIEW OF</text>
<text x="65" y="339" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="600" fill="#12304a" >•  Signal response and repeatability</text>
<text x="65" y="396" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="600" fill="#12304a" >•  Potential continuity-related changes</text>
<text x="65" y="453" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="600" fill="#12304a" >•  Approximate interpretation in context</text>
<rect x="38" y="525" width="644" height="269" rx="24" fill="#f7e9e3" stroke="none" stroke-width="1"/>
<text x="65" y="572" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#9a543c" >DOES NOT DIRECTLY ESTABLISH</text>
<text x="65" y="626" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="600" fill="#12304a" >•  Geotechnical bearing capacity</text>
<text x="65" y="683" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="600" fill="#12304a" >•  Load–settlement behaviour</text>
<text x="65" y="740" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="600" fill="#12304a" >•  A unique cause of every reflection</text>
<line x1="40" y1="865" x2="680" y2="865" stroke="#cddce2" stroke-width="2" stroke-linecap="round"/><text x="40" y="901" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#647d8b" >Explanatory diagram only · no test data or acceptance threshold</text>
</svg>
