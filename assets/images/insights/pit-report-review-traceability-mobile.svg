<svg xmlns="http://www.w3.org/2000/svg" width="400" height="723" viewBox="0 0 400 723" role="img" aria-label="Follow the evidence"><rect width="400" height="723" fill="#f2f8f9"/><rect width="400" height="155" fill="#123e5a"/><text x="25" y="32" font-size="14" font-weight="700" fill="#cce6e9" font-family="Arial,Helvetica,sans-serif">AN-THAI  /  ENGINEERING INSIGHTS</text><text x="25" y="82" font-size="27" font-weight="700" fill="#ffffff" font-family="Arial,Helvetica,sans-serif">Follow the evidence</text><text x="25" y="121" font-size="17" font-weight="400" fill="#e0eff0" font-family="Arial,Helvetica,sans-serif">One pile ID, one evidence chain.</text><rect x="18" y="177" width="364" height="87" rx="12" fill="#ffffff" stroke="#cee1e4"/><text x="36" y="210" font-size="21" font-weight="700" fill="#153c56" font-family="Arial,Helvetica,sans-serif">01  Identification</text><text x="36" y="239" font-size="18" font-weight="400" fill="#3e5b67" font-family="Arial,Helvetica,sans-serif">Pile schedule and location</text><rect x="18" y="278" width="364" height="87" rx="12" fill="#ffffff" stroke="#cee1e4"/><text x="36" y="311" font-size="21" font-weight="700" fill="#153c56" font-family="Arial,Helvetica,sans-serif">02  Field context</text><text x="36" y="340" font-size="18" font-weight="400" fill="#3e5b67" font-family="Arial,Helvetica,sans-serif">Construction and ground record</text><rect x="18" y="379" width="364" height="87" rx="12" fill="#ffffff" stroke="#cee1e4"/><text x="36" y="412" font-size="21" font-weight="700" fill="#153c56" font-family="Arial,Helvetica,sans-serif">03  Acquisition</text><text x="36" y="441" font-size="18" font-weight="400" fill="#3e5b67" font-family="Arial,Helvetica,sans-serif">Impact, sensor and test setup</text><rect x="18" y="480" width="364" height="87" rx="12" fill="#ffffff" stroke="#cee1e4"/><text x="36" y="513" font-size="21" font-weight="700" fill="#153c56" font-family="Arial,Helvetica,sans-serif">04  Primary data</text><text x="36" y="542" font-size="18" font-weight="400" fill="#3e5b67" font-family="Arial,Helvetica,sans-serif">Original traces and pile ID</text><rect x="18" y="581" width="364" height="87" rx="12" fill="#ffffff" stroke="#cee1e4"/><text x="36" y="614" font-size="21" font-weight="700" fill="#153c56" font-family="Arial,Helvetica,sans-serif">05  Interpretation</text><text x="36" y="643" font-size="18" font-weight="400" fill="#3e5b67" font-family="Arial,Helvetica,sans-serif">Assumptions and sign-off</text><text x="24" y="701" font-size="15" font-weight="600" fill="#416373" font-family="Arial,Helvetica,sans-serif">Confirm mismatches before deciding.</text></svg>
