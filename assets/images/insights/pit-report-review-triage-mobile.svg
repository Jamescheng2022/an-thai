<svg xmlns="http://www.w3.org/2000/svg" width="400" height="647" viewBox="0 0 400 647" role="img" aria-label="An unusual trace?"><rect width="400" height="647" fill="#f2f8f9"/><rect width="400" height="155" fill="#123e5a"/><text x="25" y="32" font-size="14" font-weight="700" fill="#cce6e9" font-family="Arial,Helvetica,sans-serif">AN-THAI  /  ENGINEERING INSIGHTS</text><text x="25" y="82" font-size="27" font-weight="700" fill="#ffffff" font-family="Arial,Helvetica,sans-serif">An unusual trace?</text><text x="25" y="121" font-size="17" font-weight="400" fill="#e0eff0" font-family="Arial,Helvetica,sans-serif">Review before a verdict.</text><rect x="18" y="177" width="364" height="87" rx="12" fill="#ffffff" stroke="#cee1e4"/><text x="36" y="210" font-size="21" font-weight="700" fill="#153c56" font-family="Arial,Helvetica,sans-serif">Check acquisition</text><text x="36" y="239" font-size="18" font-weight="400" fill="#3e5b67" font-family="Arial,Helvetica,sans-serif">Repeatability and signal quality</text><rect x="18" y="278" width="364" height="87" rx="12" fill="#ffffff" stroke="#cee1e4"/><text x="36" y="311" font-size="21" font-weight="700" fill="#153c56" font-family="Arial,Helvetica,sans-serif">Review context</text><text x="36" y="340" font-size="18" font-weight="400" fill="#3e5b67" font-family="Arial,Helvetica,sans-serif">Geometry, installation, soil</text><rect x="18" y="379" width="364" height="87" rx="12" fill="#ffffff" stroke="#cee1e4"/><text x="36" y="412" font-size="21" font-weight="700" fill="#153c56" font-family="Arial,Helvetica,sans-serif">Compare explanations</text><text x="36" y="441" font-size="18" font-weight="400" fill="#3e5b67" font-family="Arial,Helvetica,sans-serif">An anomaly is not a diagnosis</text><rect x="18" y="480" width="364" height="112" rx="12" fill="#ffffff" stroke="#cee1e4"/><text x="36" y="513" font-size="21" font-weight="700" fill="#153c56" font-family="Arial,Helvetica,sans-serif">Responsible judgment</text><text x="36" y="542" font-size="18" font-weight="400" fill="#3e5b67" font-family="Arial,Helvetica,sans-serif">Repeat or supplement if</text><text x="36" y="567" font-size="18" font-weight="400" fill="#3e5b67" font-family="Arial,Helvetica,sans-serif">justified</text><text x="24" y="625" font-size="15" font-weight="600" fill="#416373" font-family="Arial,Helvetica,sans-serif">No fictional thresholds or readings.</text></svg>
