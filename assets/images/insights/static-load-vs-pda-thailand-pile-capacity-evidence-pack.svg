ght="720" text-anchor="middle">03</text><text x="530" y="351" font-size="25" fill="#17394a" font-weight="720" >Observations</text><text x="530" y="398" font-size="19" fill="#56717e" font-weight="480" >Raw records</text><rect x="742" y="215" width="217" height="292" rx="22" fill="#fff" stroke="#cee0dd" stroke-width="2"/><circle cx="787" cy="268" r="27" fill="#087c85"/><text x="787" y="276" font-size="19" fill="#fff" font-weight="720" text-anchor="middle">04</text><text x="763" y="351" font-size="25" fill="#17394a" font-weight="720" >Analysis</text><text x="763" y="398" font-size="19" fill="#56717e" font-weight="480" >Revision trail</text><rect x="975" y="215" width="217" height="292" rx="22" fill="#e4f3ee" stroke="#cee0dd" stroke-width="2"/><circle cx="1020" cy="268" r="27" fill="#087c85"/><text x="1020" y="276" font-size="19" fill="#fff" font-weight="720" text-anchor="middle">05</text><text x="996" y="351" font-size="25" fill="#17394a" font-weight="720" >Sign-off</text><text x="996" y="398" font-size="19" fill="#56717e" font-weight="480" >Qualified review</text><rect x="59" y="527" width="1082" height="45" rx="12" fill="#eaf1ef" stroke="none" stroke-width="1"/><text x="600" y="556" font-size="21" fill="#17394a" font-weight="500" text-anchor="middle">Every evidence item must match the same identified test pile and approved objective.</text><line x1="64" y1="586" x2="1136" y2="586" stroke="#dbe7e6" stroke-width="2" /><text x="64" y="619" font-size="16" fill="#56717e" font-weight="400">Editorial illustration. A professional signature is evidence of review, not a purchasable shortcut.</text><text x="1136" y="648" font-size="14" fill="#087c85" font-weight="700" text-anchor="end" letter-spacing="1">AN-THAI / ENGINEERING INSIGHTS</text></svg>