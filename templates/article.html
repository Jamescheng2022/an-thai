<main id="main-content">
<article class="container insight-article">
<nav aria-label="Breadcrumb" class="insight-breadcrumb"><a href="/index.html">Home</a> <span class="insight-breadcrumb__sep" aria-hidden="true">/</span> <a href="/insights.html">Insights</a> <span class="insight-breadcrumb__sep" aria-hidden="true">/</span> <span class="insight-breadcrumb__current" aria-current="page">{{title}}</span></nav>
<header class="insight-header">
<div class="eyebrow">AN-THAI Engineering Insights</div>
<h1 class="insight-title">{{title}}</h1>
<div class="insight-meta"><span class="insight-byline">By {{author}}</span> <span class="insight-meta__sep" aria-hidden="true">·</span> <time class="insight-date" datetime="{{date}}">{{date}}</time></div>
</header>
<figure class="insight-lead-figure">
<img class="insight-lead-image brochure-image" src="{{image}}" width="{{width}}" height="{{height}}" alt="{{image_alt}}" loading="lazy" decoding="async">
<figcaption class="insight-lead-caption">{{image_caption}}</figcaption>
</figure>
<div class="insight-prose">
{{sections}}
</div>
{{faq}}
<aside class="insight-related"><h2>Related articles</h2>{{related}}</aside>
<section class="insight-cta">
<div class="insight-cta__eyebrow">Engineering Discussion</div>
<h2>Discuss your project</h2>
<p>{{cta_note}}</p>
<p><a class="btn primary" href="{{cta_href}}">{{cta_label}}</a></p>
</section>
</article>
</main>
